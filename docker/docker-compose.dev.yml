services:
  node-server:
    image: node-server:latest
    container_name: node-server
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      HOST: '0.0.0.0'
      PORT: '3000'
    env_file:
      - ../backend/.env.sample
    networks:
      - app-network
    depends_on:
      - postgres
    volumes:
      - ../logs:/log/app

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    env_file:
      - ../backend/.env.sample
    networks:
      - app-network
    volumes:
      - postgres:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - app-network
    volumes:
      - grafana-data:/var/lib/grafana

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
      - app-network
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../data:/prometheus

volumes:
  grafana-data:
  prometheus-data:
  postgres:


networks:
  app-network:
    driver: bridge

