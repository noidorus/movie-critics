openapi: 3.0.1
info:
  title: Movie Critics Api
  description: 'Movie Critics Api - provides access to movie data and allows you to create lists with movies, comment on movies, and set ratings.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
  - url: /
tags:
  - name: Auth
    description: 'Authentication endpoints'
  - name: Comments
    description: 'Operations for creating, editing and deleting comments'
  - name: Films
    description: 'Operations for getting: film, filters, comments; rating films'
  - name: Lists
    description: 'Operations for creating, editing and deleting lists'

paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: 'Register new user'
      operationId: 'registerUser'
      requestBody:
        description: 'User data for registration'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDTO'
        required: true
      responses:
        '204':
          description: 'User created'
        '400':
          description: 'Bad request'
        '409':
          description: 'User already exists'
        '500':
          description: 'Something went wrong'

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: 'Login user'
      operationId: 'loginUser'
      requestBody:
        description: 'User login data'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
        required: true
      responses:
        '200':
          description: 'User logged in'
          headers:
            Set-Cookie:
              description: 'Access and refreshAccess session cookie'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
        '403':
          description: 'Invalid credentials'
        '500':
          description: 'Something went wrong'

  /api/auth/logout:
    get:
      tags:
        - Auth
      summary: 'Logout user'
      operationId: 'logoutUser'
      responses:
        '204':
          description: 'User logged out'
        '401':
          description: 'Unauthorized'
        '500':
          description: 'Something went wrong'

  /api/auth:
    get:
      tags:
        - Auth
      summary: 'Get authenticated user data'
      operationId: 'getUserData'
      responses:
        '200':
          description: 'User authenticated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'User not found'
        '500':
          description: 'Something went wrong'

  /api/auth/refresh:
    get:
      tags:
        - Auth
      summary: 'Refresh access token'
      responses:
        '200':
          description: 'Access token updated'
          headers:
            Set-Cookie:
              description: "Access token are set as cookie. Example: `refresh_jwt=abcd5678;\
                \ HttpOnly; Path=/; Max-Age=86400`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'User not found'
        '500':
          description: 'Something went wrong'

  /api/films:
    get:
      tags:
        - Films
      summary: 'Get films data'
      operationId: 'getFilms'
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 'List of films'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmsEntity'
        '400':
          description: 'Bad request'
        '500':
          description: 'Something went wrong'

  /api/films/search:
    get:
      tags:
        - Films
      summary: 'Search films by name'
      operationId: 'searchFilms'
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            example: 'Avatar'
      responses:
        '200':
          description: 'Film data with extras'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmWithExtrasEntity'
        '500':
          description: 'Something went wrong'

  /api/films/{id}:
    get:
      tags:
        - Films
      summary: 'Get film data by ID'
      description: 'Fetches detailed information about a specific film by its ID.'
      operationId: 'getFilmById'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Film data with extras'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmWithExtrasEntity'
        '400':
          description: 'Bad request'
        '404':
          description: 'Film not found'
        '500':
          description: 'Something went wrong'

  /api/films/{id}/rate:
    post:
      tags:
        - Films
      summary: 'Rate a film'
      operationId: 'rateFilm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateFilmBodyDTO'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: 'integer'
      responses:
        '200':
          description: 'Film rated successfully'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingEntity'
        '401':
          description: 'Unauthorized'
        '400':
          description: 'Bad request'
        '404':
          description: 'Film not found'
        '500':
          description: 'Something went wrong'

  /api/films/{id}/comments:
    get:
      tags:
        - Films
      summary: 'Get comments by film ID'
      operationId: 'getCommentsByFilmId'
      parameters:
        - name: id
          in: path
          required: true
          description: 'ID of the film to retrieve comments for'
          schema:
            type: integer
      responses:
        '200':
          description: 'List of comments for the film'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentEntity'
        '400':
          description: 'Bad request'
        '404':
          description: 'Film not found'
        '500':
          description: 'Something went wrong'

  /api/comments:
    post:
      tags:
        - Comments
      summary: 'Create comment'
      operationId: 'createComment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentDTO'
      responses:
        '200':
          description: 'Comment created successfully'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEntity'
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '500':
          description: 'Something went wrong'

  /api/comments/{id}:
    delete:
      tags:
        - Comments
      summary: 'Delete comment by ID'
      operationId: 'deleteComment'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Comment deleted successfully'
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Comment not found'
        '500':
          description: 'Something went wrong'
    patch:
      tags:
        - Comments
      summary: 'Edit comment by ID'
      operationId: 'editComment'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCommentDTO'
      responses:
        '200':
          description: 'Comment edited successfully'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEntity'
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Comment not found'
        '500':
          description: 'Something went wrong'

  /api/lists:
    get:
      tags:
        - Lists
      summary: 'Get all public lists'
      operationId: 'getLists'
      responses:
        '200':
          description: 'List of public lists'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListWithAuthorAndShortFilms'
        '500':
          description: 'Something went wrong'
    post:
      tags:
        - Lists
      summary: 'Create list'
      operationId: 'createList'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListDTO'
      responses:
        '201':
          description: 'List created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntity'
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '409':
          description: 'List with this name already exists'
        '500':
          description: 'Something went wrong'

  /api/lists/my:
    get:
      tags:
        - Lists
      summary: 'Get authentificated user lists'
      operationId: 'getMyLists'
      responses:
        '200':
          description: "User's lists"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListWithAuthorAndShortFilms'
        '401':
          description: 'Unauthorized'
        '500':
          description: 'Something went wrong'

  /api/lists/{id}:
    get:
      tags:
        - Lists
      summary: 'Get list by ID'
      description: 'Returns public list or private list if user authentificated'
      operationId: 'getListById'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'List data'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWithAuthorAndFilms'
        '400':
          description: 'Bad request'
        '404':
          description: 'List not found'
        '500':
          description: 'Something went wrong'
    delete:
      tags:
        - Lists
      summary: 'Delete list by ID'
      operationId: 'removeList'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'List deleted successfully'
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'List not found'
        '500':
          description: 'Something went wrong'

  /api/lists/{id}/visibility:
    patch:
      tags:
        - Lists
      summary: 'Change list visibility'
      operationId: 'changeListVisibility'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeListVisibilityDTO'
      responses:
        '200':
          description: 'List visibility updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntity'
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '403':
          description: 'You have not access to this list'
        '404':
          description: 'List not found'
        '500':
          description: 'Something went wrong'

  /api/lists/{id}/films/{filmId}:
    post:
      tags:
        - Lists
      summary: 'Add film to list'
      operationId: 'addFilmToList'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: filmId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Film added to list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmInListEntity'
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '403':
          description: 'You have not access to this list'
        '404':
          description: 'List not found'
        '500':
          description: 'Something went wrong'
    delete:
      tags:
        - Lists
      summary: 'Remove film from list'
      operationId: 'removeFilmFromList'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: filmId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Film removed from list'
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '403':
          description: 'You have not access to this list'
        '404':
          description: 'List or film not found'
        '500':
          description: 'Something went wrong'

components:
  schemas:
    RegisterDTO:
      type: object
      properties:
        username:
          type: string
          example: user123
        password:
          type: string
          example: password123
        email:
          type: string
          example: user@example.com

    LoginDTO:
      type: object
      properties:
        username:
          type: string
          example: user123
        password:
          type: string
          example: password123

    UserEntity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: user123
        email:
          type: string
          example: pXwQ8@example.com
        role:
          type: string
          example: CLIENT
          enum:
            - CLIENT
            - ADMIN
            - ROOT
        createdAt:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2023-01-02T12:00:00Z

    ShortInfoFilmEntity:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the film
          example: 1282979
        nameRu:
          type: string
          example: LEGO Ниндзяго
          nullable: true
        nameOriginal:
          type: string
          example: null
          nullable: true
        filmLength:
          type: integer
          description: Length of the film in minutes or in series
          example: 11
        year:
          type: integer
          example: 2019
        posterUrlPreview:
          type: string
          example: https://placehold.co/600x400
        type:
          type: string
          example: TV_SERIES
          enum:
            - VIDEO
            - FILM
            - MINI_SERIES
            - TV_SERIES
            - TV_SHOW
        countries:
          type: array
          example:
            - name: США
            - name: Канада
            - name: Дания
          items:
            type: object
            properties:
              name:
                type: string
        genres:
          type: array
          example:
            - name: приключения
          items:
            type: object
            properties:
              name:
                type: string
        avgRating:
          type: number
          format: float
          example: 6.0

    FilmEntity:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the film
          example: 1282979
        nameRu:
          type: string
          example: LEGO Ниндзяго
          nullable: true
        nameOriginal:
          type: string
          example: null
          nullable: true
        slogan:
          type: string
          example: It's all fun and games until you reach Level 13.
        description:
          type: string
          example: Ниндзя сражаются со злодеями в Ниндзяго-Сити и за его пределами...
        shortDescription:
          type: string
          example: Заскучавшие ниндзя случайно выпускают из заточения опасную злодейку.
        filmLength:
          type: integer
          description: Length of the film in minutes or in series
          example: 11
        year:
          type: integer
          example: 2019
        posterUrl:
          type: string
          example: https://placehold.co/600x400
        posterUrlPreview:
          type: string
          example: https://placehold.co/600x400
        createdAt:
          type: string
          format: date-time
          example: 2023-11-07T12:00:00Z
        type:
          type: string
          example: TV_SERIES
          enum:
            - VIDEO
            - FILM
            - MINI_SERIES
            - TV_SERIES
            - TV_SHOW
        countries:
          type: array
          example:
            - name: США
            - name: Канада
            - name: Дания
          items:
            type: object
            properties:
              name:
                type: string
        genres:
          type: array
          example:
            - name: приключения
            - name: боевик
            - name: мультфильм
          items:
            type: object
            properties:
              name:
                type: string
        avgRating:
          type: number
          format: float
          example: 6.0

    FilmsEntity:
      type: object
      properties:
        totalItems:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10
        page:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/FilmEntity'

    FilmWithExtrasEntity:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the film
          example: 1282979
        nameRu:
          type: string
          example: LEGO Ниндзяго
          nullable: true
        nameOriginal:
          type: string
          example: null
          nullable: true
        slogan:
          type: string
          example: It's all fun and games until you reach Level 13.
        description:
          type: string
          example: Ниндзя сражаются со злодеями в Ниндзяго-Сити и за его пределами...
        shortDescription:
          type: string
          example: Заскучавшие ниндзя случайно выпускают из заточения опасную злодейку.
        filmLength:
          type: integer
          description: Length of the film in minutes or in series
          example: 11
        year:
          type: integer
          example: 2019
        posterUrl:
          type: string
          example: https://placehold.co/600x400
        posterUrlPreview:
          type: string
          example: https://placehold.co/600x400
        createdAt:
          type: string
          format: date-time
          example: 2023-11-07T12:00:00Z
        type:
          type: string
          example: TV_SERIES
          enum:
            - VIDEO
            - FILM
            - MINI_SERIES
            - TV_SERIES
            - TV_SHOW
        countries:
          type: array
          example:
            - name: США
            - name: Канада
            - name: Дания
          items:
            type: object
            properties:
              name:
                type: string
        genres:
          type: array
          example:
            - name: приключения
            - name: боевик
            - name: мультфильм
          items:
            type: object
            properties:
              name:
                type: string
        ratings:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              userRating:
                type: integer
                example: 6
              userId:
                type: integer
                example: 1
              filmId:
                type: integer
                example: 1
        avgRating:
          type: number
          format: float
          example: 6.0
        boxOffice:
          type: string
          nullable: true
          example: '$ 100,000,000'
        awards:
          type: string
          nullable: true
          example: '3 wins'
        actors:
          type: string
          nullable: true
          example: 'Kazumi Evans, Sabrina Pitre, Rebecca Shoichet'

    RateFilmBodyDTO:
      type: object
      properties:
        rating:
          type: integer
          description: 'Rating value for the film, typically between 1 and 5'
          example: 4

    RatingEntity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        filmId:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        userRating:
          type: integer
          example: 5

    CreateCommentDTO:
      type: object
      properties:
        text:
          type: string
          example: This is a new comment.
        filmId:
          type: integer
          example: 1

    EditCommentDTO:
      type: object
      properties:
        content:
          type: string
          description: The updated content of the comment
          example: Updated comment content.

    CommentEntity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        text:
          type: string
          example: This is a comment.
        authorId:
          type: integer
          example: 2
        filmId:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2023-01-02T12:00:00Z
        author:
          type: object
          properties:
            username:
              type: string
              example: user123
            id:
              type: integer
              example: 1

    CreateListDTO:
      type: object
      properties:
        name:
          type: string
          example: 'My Favorite Movies'
        private:
          type: boolean
          example: true
      required:
        - name

    ChangeListVisibilityDTO:
      type: object
      properties:
        private:
          type: boolean
          example: true
      required:
        - private

    ListEntity:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'My Favorite Movies'
        private:
          type: boolean
          example: false
        authorId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2023-01-02T12:00:00Z

    ListWithAuthorAndShortFilms:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'My Favorite Movies'
        private:
          type: boolean
          example: false
        authorId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2023-01-02T12:00:00Z
        author:
          type: object
          properties:
            username:
              type: string
              example: 'username123'
        films:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              posterUrlPreview:
                type: string
                example: https://placehold.co/600x400

    ListWithAuthorAndFilms:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'My Favorite Movies'
        private:
          type: boolean
          example: false
        authorId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          example: 2023-01-01T12:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2023-01-02T12:00:00Z
        author:
          type: object
          properties:
            name:
              type: string
              example: 'username123'
        films:
          type: array
          items:
            $ref: '#/components/schemas/FilmInListEntity'

    FilmInListEntity:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the film
          example: 1282979
        nameRu:
          type: string
          example: LEGO Ниндзяго
          nullable: true
        nameOriginal:
          type: string
          example: null
          nullable: true
        filmLength:
          type: integer
          description: Length of the film in minutes or in series
          example: 11
        year:
          type: integer
          example: 2019
        posterUrlPreview:
          type: string
          example: https://placehold.co/600x400
        createdAt:
          type: string
          format: date-time
          example: 2023-11-07T12:00:00Z
        type:
          type: string
          example: TV_SERIES
          enum:
            - VIDEO
            - FILM
            - MINI_SERIES
            - TV_SERIES
            - TV_SHOW
        countries:
          type: array
          example:
            - name: США
            - name: Канада
            - name: Дания
          items:
            type: object
            properties:
              name:
                type: string
        genres:
          type: array
