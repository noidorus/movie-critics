services:
  node-server:
    container_name: node-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.sample
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    env_file:
      - .env.sample
    networks:
      - app-network
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:


networks:
  app-network:
    driver: bridge
